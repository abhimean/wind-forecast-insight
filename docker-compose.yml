
services:
  backend:
    build:
      context: ./backend
    container_name: wind-insight-backend
    ports:
      - "8000:8000"
    environment:
      ELEXON_BASE_URL: https://data.elexon.co.uk/bmrs/api/v1
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: wind-insight-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
